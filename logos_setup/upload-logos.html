<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Subida de escudos — SuperLiga THC</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:40px auto;padding:0 16px;background:#0f1115;color:#eee}
h1{font-size:20px}
button{background:#2f6fe4;color:#fff;border:0;border-radius:8px;padding:10px 18px;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
#log{margin-top:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;background:#1a1d24;border-radius:8px;padding:12px;max-height:60vh;overflow:auto}
.ok{color:#5ad17a}
.err{color:#f06060}
</style>
</head>
<body>
<h1>Subida de escudos a Supabase Storage</h1>
<p>Esta página sube los 32 escudos del bucket <code>team-logos</code>. Usala una sola vez y avisale a Claude cuando termine para que te diga los próximos pasos.</p>
<button id="go">Subir los 32 escudos</button>
<div id="log"></div>
<script>
const SB_URL='https://thdwohtkvhbynodrnewr.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRoZHdvaHRrdmhieW5vZHJuZXdyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0Njk4NzQsImV4cCI6MjEwNjA0NTg3NH0.VgExV9nwcyuVFPfTRhydbnE92D-nwzvgeKXKHa1gnKk';
const sb=window.supabase.createClient(SB_URL,SB_KEY);
const IDS=['sl21','sl210','sl211','sl212','sl213','sl214','sl215','sl216','sl22','sl23','sl24','sl25','sl26','sl27','sl28','sl29','thc1','thc10','thc11','thc12','thc13','thc14','thc15','thc16','thc2','thc3','thc4','thc5','thc6','thc7','thc8','thc9'];
const logEl=document.getElementById('log');
function line(msg,cls){const d=document.createElement('div');if(cls)d.className=cls;d.textContent=msg;logEl.appendChild(d);logEl.scrollTop=logEl.scrollHeight}
document.getElementById('go').onclick=async()=>{
 document.getElementById('go').disabled=true;
 let ok=0,fail=0;
 for(const id of IDS){
  try{
   const res=await fetch(`${id}.webp`);
   if(!res.ok)throw new Error('no se pudo leer el archivo local');
   const blob=await res.blob();
   const{error}=await sb.storage.from('team-logos').upload(`${id}.webp`,blob,{upsert:true,contentType:'image/webp'});
   if(error)throw error;
   ok++;line(`OK  ${id}.webp`,'ok');
  }catch(e){
   fail++;line(`ERROR ${id}: ${e.message||e}`,'err');
  }
 }
 line(`\nListo. Subidos: ${ok} / ${IDS.length}. Errores: ${fail}.`,fail?'err':'ok');
 document.getElementById('go').disabled=false;
};
</script>
</body>
</html>
