<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SuperLiga THC</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef1f5;--pn:#fff;--ln:#dde2ea;--tx:#141a26;--mu:#6a7488;--ac:#0f9d58;--hd:#0f1b2d;--hx:#fff;--lv:#e5484d;--bl:#2f6fe4;--gd:#c9962c;--zb:rgba(20,26,38,.03)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--pn:#131d30;--ln:#243049;--tx:#e8edf6;--mu:#8b97ad;--ac:#2fd07f;--hd:#070d18;--zb:rgba(255,255,255,.03)}}
:root[data-theme="dark"]{--bg:#0b1220;--pn:#131d30;--ln:#243049;--tx:#e8edf6;--mu:#8b97ad;--ac:#2fd07f;--hd:#070d18;--zb:rgba(255,255,255,.03)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{background:var(--hd);color:var(--hx);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top{display:flex;align-items:center;gap:10px;padding:10px 12px;max-width:940px;margin:auto}
.logo{font-weight:800;font-size:18px;letter-spacing:-.3px}.logo b{color:var(--ac)}
.top input{flex:1;min-width:0;padding:7px 10px;border-radius:6px;border:0;background:#ffffff1f;color:#fff}
.top input::placeholder{color:#b8c2d4}
button,select,input{font:inherit}
button{cursor:pointer}
.eb{background:none;border:1px solid #ffffff55;color:#fff;border-radius:6px;padding:6px 9px}
.eb.on{background:var(--ac);border-color:var(--ac);color:#04140b}
nav{display:flex;gap:2px;overflow-x:auto;max-width:940px;margin:auto;padding:0 8px}
nav button{background:none;border:0;color:#b8c2d4;padding:9px 12px;border-bottom:3px solid transparent;white-space:nowrap}
nav button.on{color:#fff;border-color:var(--ac);font-weight:600}
main{max-width:940px;margin:auto;padding:12px}
.seg{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:16px;padding:5px 12px}
.seg button.on{background:var(--ac);border-color:var(--ac);color:#04140b;font-weight:600}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:6px;margin-bottom:12px;overflow:hidden}
.box h3{margin:0;padding:8px 12px;font-size:14px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between}
.box h3 span{color:var(--mu);font-weight:400;font-size:12px}
.m{display:grid;grid-template-columns:62px 1fr 56px 1fr;align-items:center;padding:9px 12px;border-bottom:1px solid var(--ln);gap:6px}
.m:last-child{border-bottom:0}
.m .r{text-align:right}.sc{text-align:center;font-weight:700}
.st{font-size:12px;color:var(--mu)}
.vivo .st{color:var(--lv);font-weight:700}.vivo .sc{color:var(--lv)}
.ed{display:flex;gap:6px;padding:6px 12px 10px;border-bottom:1px solid var(--ln);flex-wrap:wrap;background:var(--bg)}
.rw input,.ed input,.ed select,.f input,.f select{padding:5px 7px;border:1px solid var(--ln);border-radius:5px;background:var(--pn);color:var(--tx)}
.ed input[type=number]{width:54px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--ln)}
th{font-size:12px;color:var(--mu);font-weight:600}
td.n{text-align:left;font-weight:600;padding-left:10px}
td.n a{cursor:pointer}
tr td:first-child{border-left:4px solid transparent}
tr.z0 td:first-child{border-color:var(--gd)}tr.z0{background:rgba(201,150,44,.12)}table tr:hover td{background:var(--bg)}
tr.z0:hover td,tr.z0 td{background:rgba(201,150,44,.12)}
.postab td.n,.postab th:nth-child(2){position:sticky;left:0;background-color:var(--pn);z-index:1}
.postab tr.z0 td.n{background-color:#fdf6e7}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .postab tr.z0 td.n{background-color:#2a2214}}
:root[data-theme="dark"] .postab tr.z0 td.n{background-color:#2a2214}
.postab tr:hover td.n{background-color:var(--bg)}
@media(max-width:480px){.postab th:last-child,.postab td:last-child{display:none}}
tr.z1 td:first-child{border-color:var(--ac)}tr.z2 td:first-child{border-color:var(--bl)}tr.z3 td:first-child{border-color:var(--lv)}
.lg{font-size:12px;color:var(--mu);padding:8px 12px}
.lg i{display:inline-block;width:10px;height:10px;margin:0 4px 0 10px;border-radius:2px}
.rw{display:flex;justify-content:space-between;padding:9px 12px;border-bottom:1px solid var(--ln)}
.rw:last-child{border-bottom:0}
.mu{color:var(--mu)}
.f{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px}
.f button,.ed button{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:5px;padding:5px 10px}
.f .pri{background:var(--ac);border-color:var(--ac);color:#04140b;font-weight:600}
.x{color:var(--lv)}
.empty{padding:20px;text-align:center;color:var(--mu)}
.evr{display:flex;justify-content:space-between;gap:8px;padding:0 12px 9px;margin-top:-6px;border-bottom:1px solid var(--ln);font-size:11.5px;color:var(--mu);flex-wrap:wrap}
.evr .r{text-align:right;margin-left:auto}
.cr{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--bl);color:#fff;font-size:9px;font-weight:800;margin-right:7px;flex:none}
td.n{display:flex;align-items:center}
.frm{display:flex;gap:3px;justify-content:center}
.fl{width:18px;height:18px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff}
.fl.W{background:var(--ac)}.fl.D{background:#d8a92e}.fl.L{background:var(--lv)}
img.cr{background:none;border-radius:0;object-fit:contain}
.pos{display:inline-block;min-width:14px;font-weight:700}
.mv{font-size:9px;margin-left:3px}.mv.up{color:var(--ac)}.mv.dn{color:var(--lv)}.mv.eq{color:var(--mu)}
.nx{display:flex;justify-content:center}.nx .cr{margin:0;width:24px;height:24px}
.dl{height:24px;width:auto;margin-right:8px}
.sl{height:15px;width:auto;vertical-align:middle;margin-right:6px}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .sl,:root:not([data-theme="light"]) .tl{filter:invert(1)}}
:root[data-theme="dark"] .sl,:root[data-theme="dark"] .tl{filter:invert(1)}
.tl{height:14px;width:auto;vertical-align:middle;margin-right:5px}
.hl{height:42px;width:auto;display:block;filter:invert(1)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .dl{filter:invert(1)}}
:root[data-theme="dark"] .dl{filter:invert(1)}
.evp{padding:8px 12px 12px;background:var(--bg);border-bottom:1px solid var(--ln)}
.og{color:var(--lv);font-weight:600}
.wn{color:#b7791f;font-size:12px;padding:6px 0 0}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:680px){.g2{grid-template-columns:1fr}}
.tcard{display:flex;align-items:center;gap:12px}
.tcard .cr,.tcard img.cr{width:56px;height:56px}
.npm{display:flex;align-items:center;justify-content:space-around;padding:10px 12px;text-align:center;gap:6px}
.npm div{display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;font-size:12px;flex:1;min-width:0}
.npm .cr,.npm img.cr{width:36px;height:36px}
.fmw{flex:none;width:70px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:3px}
.fmw .cr,.fmw img.cr{width:26px;height:26px;margin:2px 0}
.t3g{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:10px 12px}
@media(max-width:520px){.t3g{grid-template-columns:1fr}}
.t3r{display:flex;align-items:center;gap:8px;padding:4px 0}
.t3r span:nth-child(2){flex:1;font-size:13px}
.t3n{width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:var(--mu);flex:none}
.t3n.m1{background:var(--gd)}.t3n.m2{background:#9aa4b8}.t3n.m3{background:#a9713a}
.ven{font-size:10.5px;color:var(--mu);text-align:center;padding:0 12px 8px;margin-top:-4px}
.ptsb{font-weight:800;background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:2px 7px;display:inline-block;min-width:20px}
.h2hstat{display:flex;align-items:center;justify-content:space-around;padding:12px;text-align:center;gap:6px}
.h2hstat div{display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:0}
.h2hstat .cr,.h2hstat img.cr{width:34px;height:34px}
.h2hstat b{font-size:20px}
.h2hstat span:not(.mu){font-weight:600;font-size:12px;max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.h2hrow{display:grid;grid-template-columns:1fr 70px 1fr;align-items:center;padding:9px 12px;border-bottom:1px solid var(--ln);gap:6px}
.h2hrow:last-child{border-bottom:0}
.h2hrow .r{text-align:right}
.h2hrow span{display:flex;align-items:center;gap:6px}
.h2hrow .r span{justify-content:flex-end}
a{color:inherit;text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
.m a{display:flex;align-items:center;font-weight:600}
.m a.r{justify-content:flex-end}
.m a.r .cr{margin:0 0 0 7px}
.pst{display:inline-flex;gap:6px;color:var(--mu);font-size:12px}
.vm{display:block;text-align:center;padding:7px;color:var(--bl);border-top:1px solid var(--ln);cursor:pointer;font-size:12.5px}
.hide{display:none}
.bmatch{position:absolute;left:0;width:206px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;cursor:pointer;overflow:hidden}
.bsc{color:var(--mu);font-size:9.5px;margin-right:5px;flex:none;white-space:nowrap}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;flex:none}
.pwrap{display:inline-flex;flex-direction:column;align-items:flex-start;line-height:1.25}
.ptick{width:13px;height:2px;border-radius:1px;margin-top:2px}
.posel{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:5px;padding:2px 4px;font-size:11px;margin-right:6px}
.donec{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;color:var(--mu);font-size:11.5px;margin-left:6px}
.donec button{border:1px solid var(--ln);background:var(--pn);color:var(--tx);border-radius:5px;padding:2px 6px;font-size:11px;cursor:pointer}
.donec button.pri{background:var(--ac);border-color:var(--ac);color:#04140b;font-weight:600}
.discrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 16px;padding:10px 12px;border-bottom:1px solid var(--ln)}
.discrow:last-child{border-bottom:0}
.discname{display:flex;align-items:center;gap:6px;font-weight:600;flex:1;min-width:140px}
.discname .mu{font-weight:400;font-size:12px}
.dischist,.discsanc{display:flex;align-items:center;gap:6px;flex:none}
.dischist .mu{font-size:10.5px;text-transform:uppercase;letter-spacing:.03em}
.pill{display:inline-flex;align-items:center;gap:3px;border-radius:12px;padding:2px 9px;font-size:12px;font-weight:700}
.pill.y{background:rgba(216,169,46,.15);color:#9a7312}
.pill.r{background:rgba(229,72,77,.12);color:var(--lv)}
.pill.pend{background:rgba(229,72,77,.15);color:var(--lv)}
.pill.ok{background:rgba(15,157,88,.12);color:var(--ac)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .pill.y{color:#e8c75a}:root:not([data-theme="light"]) .pill.r,:root:not([data-theme="light"]) .pill.pend{color:#ff8f93}}
:root[data-theme="dark"] .pill.y{color:#e8c75a}
:root[data-theme="dark"] .pill.r,:root[data-theme="dark"] .pill.pend{color:#ff8f93}
.bmatch:hover{border-color:var(--bl)}
.brow{display:flex;align-items:center;gap:4px;padding:3px 6px;font-size:11.5px;border-bottom:1px solid var(--ln)}
.brow:last-child{border-bottom:0}
.brow span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow.bw{font-weight:800}
.brow .cr{width:16px;height:16px;font-size:7px;margin-right:3px}
.bl{flex:none;width:12px;height:12px;border-radius:3px;background:var(--bl);color:#fff;font-size:8px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;margin-right:3px}
.bl.bv{background:var(--mu)}
.mres{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--ln);cursor:pointer}
.mres:last-child{border-bottom:0}
.badge{font-size:10px;color:var(--mu);border:1px solid var(--ln);border-radius:8px;padding:1px 6px;margin-right:6px}
.rez{padding:3px 8px;border-radius:5px;font-weight:700;color:#fff;font-size:12px}
.rez.W{background:var(--ac)}.rez.D{background:#d8a92e}.rez.L{background:var(--lv)}
.redt{color:var(--lv);margin-left:4px}
.det{display:none;padding:0 12px 10px;border-bottom:1px solid var(--ln);background:var(--bg)}
.det.on{display:block}
.stl{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media(max-width:520px){.stl{grid-template-columns:1fr}}
.leg{font-size:11px;color:var(--mu);padding:4px 12px 0}
.gl{padding:6px 12px 10px;font-size:12px;font-weight:700;border-bottom:1px solid var(--ln)}
.seed{color:var(--gd);font-size:11px;font-weight:700}
</style>
</head>

const toDbMatch=m=>({id:m.id,div:m.div,round:m.round,home_id:m.home,away_id:m.away,hg:m.hg,ag:m.ag,status:m.status,time:m.time||null,ev:m.ev||[],season_id:m.season_id||SEASON_ID});
const fromDbMatch=r=>({id:r.id,div:r.div,round:r.round,home:r.home_id,away:r.away_id,hg:r.hg,ag:r.ag,status:r.status,time:r.time,ev:r.ev||[],season_id:r.season_id});
const toDbCup=c=>({id:c.id,fase:c.fase,llave:c.llave,leg:c.leg,home_id:c.home,away_id:c.away,hg:c.hg,ag:c.ag,pl:c.pl??null,pv:c.pv??null,status:c.status,ev:c.ev||[],season_id:c.season_id||SEASON_ID});

const POSC={POR:'#8b5e34',DEF:'#2f6fe4',MED:'#0f9d58',DEL:'#e5484d'},POSN={POR:'Arquero',DEF:'Defensa',MED:'Mediocampo',DEL:'Delantero'};
const posDot=pos=>pos?`<span class="pdot" style="background:${POSC[pos]}" title="${POSN[pos]}"></span>`:'';
const posLine=(pos,name)=>pos?`<span class="pwrap" title="${POSN[pos]}">${name}<span class="ptick" style="background:${POSC[pos]}"></span></span>`:name;
function setPos(id,v){const p=db.players.find(x=>x.id===id);if(!p)return;p.position=v||null;save()}
const KIND_TBL={teams:'teams',players:'players',matches:'matches',cup:'cup_matches'};

const Data={
 async load(){
  try{
   const[t,p,m,cp,cm]=await Promise.all([
    sb.from('teams').select('*'),sb.from('players').select('*'),
    sb.from('matches').select('*'),sb.from('cup_players').select('*'),
    sb.from('cup_matches').select('*')]);
   const err=t.error||p.error||m.error||cp.error||cm.error;
   if(err)throw err;
   if(!t.data.length)return null;
   return{teams:t.data,players:p.data.map(fromDbPlayer),matches:m.data.map(fromDbMatch),
    cup:cm.data.map(fromDbCup),cupPlayers:cp.data.map(fromDbPlayer)};
  }catch(e){console.error('Supabase load error',e);return null}
 },
 async save(d){
  try{
   const res=await Promise.all([
    sb.from('teams').upsert(d.teams),
    sb.from('players').upsert(d.players.map(toDbPlayer)),
    sb.from('matches').upsert(d.matches.map(toDbMatch)),
    sb.from('cup_players').upsert((d.cupPlayers||[]).map(toDbPlayer)),
    sb.from('cup_matches').upsert(d.cup.map(toDbCup))
   ]);
   const err=res.find(r=>r.error);
   if(err)throw err.error;
   const ids=(d.cupPlayers||[]).map(p=>p.id);
   const cl=ids.length?sb.from('cup_players').delete().not('id','in','('+ids.map(i=>'"'+i+'"').join(',')+')'):sb.from('cup_players').delete().neq('id','');
   const r2=await cl;if(r2.error)throw r2.error;
  }catch(e){console.error('Supabase save error',e);alert('No se pudo guardar en la base en línea: '+(e.message||e))}
 },
 async delRow(table,id){try{await sb.from(table).delete().eq('id',id)}catch(e){console.error(e)}}

 const r={};db.teams.filter(t=>t.div===dv).forEach(t=>r[t.id]={id:t.id,pj:0,g:0,e:0,p:0,gf:0,gc:0,pts:0});
 db.matches.filter(m=>m.div===dv&&m.status==='fin'&&(upto==null||m.round<=upto)&&r[m.home]&&r[m.away]).forEach(m=>{
  const h=r[m.home],a=r[m.away];h.pj++;a.pj++;h.gf+=m.hg;h.gc+=m.ag;a.gf+=m.ag;a.gc+=m.hg;

function llaveAgg(ll){
 const gf=(team,m)=>m.home===team?m.hg:(m.away===team?m.ag:null);
 const legs=db.cup.filter(c=>c.llave===ll).sort((a,b)=>a.leg-b.leg);
 const ida=legs.find(l=>l.leg===1);if(!ida)return null;
 const vta=legs.find(l=>l.leg===2),ter=legs.find(l=>l.leg===3),A=ida.home,B=ida.away;
 let gA=null,gB=null;
 if(ida.status==='fin'){gA=(gA||0)+gf(A,ida);gB=(gB||0)+gf(B,ida)}
 if(vta&&vta.status==='fin'){gA=(gA||0)+gf(A,vta);gB=(gB||0)+gf(B,vta)}
 const bothPlayed=ida.status==='fin'&&(!vta||vta.status==='fin');
 let winner=null;
 if(bothPlayed&&gA!=null){
  if(gA>gB)winner=A;else if(gB>gA)winner=B;
  else if(ter&&ter.status==='fin'){if(ter.hg>ter.ag)winner=ter.home;else if(ter.ag>ter.hg)winner=ter.away;else if(ter.pl!=null&&ter.pv!=null)winner=ter.pl>ter.pv?ter.home:ter.away}
  else if(!vta&&ida.pl!=null&&ida.pv!=null)winner=ida.pl>ida.pv?A:B; // final a partido único, definición a penales
 }
 const sc=(leg,team)=>leg&&leg.status==='fin'?gf(team,leg):null;
 const legArr=[{a:sc(ida,A),b:sc(ida,B)}];
 if(vta)legArr.push({a:sc(vta,A),b:sc(vta,B)});
 if(ter)legArr.push({a:sc(ter,A),b:sc(ter,B)});
 const pens=(ter&&ter.status==='fin'&&ter.pl!=null&&ter.pv!=null)?{a:ter.pl,b:ter.pv}:null;
 return{ll,A,B,gA,gB,winner,decided:!!winner,legs:legArr,pens};
}
const CUP_FASES=['16AVOS','OCTAVOS','CUARTOS','SEMIFINAL','FINAL'],CUP_N={'16AVOS':16,OCTAVOS:8,CUARTOS:4,SEMIFINAL:2,FINAL:1};
/* Si una llave queda empatada en el global tras ida y vuelta, crea solo el tercer partido (definición a penales) */
function ensureTercerPartido(){
 const gf=(team,m)=>m.home===team?m.hg:(m.away===team?m.ag:null);
 const llaves=[...new Set(db.cup.map(c=>c.llave))];
 let changed=false;
 llaves.forEach(ll=>{
  const legs=db.cup.filter(c=>c.llave===ll);
  const ida=legs.find(l=>l.leg===1),vta=legs.find(l=>l.leg===2),ter=legs.find(l=>l.leg===3);
  if(!ida||!vta||ida.status!=='fin'||vta.status!=='fin'||ter)return;
  const gA=gf(ida.home,ida)+gf(ida.home,vta),gB=gf(ida.away,ida)+gf(ida.away,vta);
  if(gA===gB){db.cup.push({id:uid('c'),fase:ida.fase,llave:ll,leg:3,home:ida.home,away:ida.away,hg:0,ag:0,pl:null,pv:null,status:'prox',ev:[]});changed=true}
 });
 return changed;
}
/* Pasa solo/a a los ganadores de cada llave a la ronda siguiente, creando los partidos que falten */
function advanceCup(){
 let changed=false;
 for(let fi=0;fi<CUP_FASES.length-1;fi++){
  const fase=CUP_FASES[fi],next=CUP_FASES[fi+1],n=CUP_N[next];
  for(let k=1;k<=n;k++){
   const llA=`${fase}-${String(2*k-1).padStart(2,'0')}`,llB=`${fase}-${String(2*k).padStart(2,'0')}`;
   const wA=llaveAgg(llA)?.winner,wB=llaveAgg(llB)?.winner;
   if(!wA||!wB)continue;
   const llave=`${next}-${String(k).padStart(2,'0')}`;
   let ida=db.cup.find(c=>c.llave===llave&&c.leg===1);
   if(!ida){db.cup.push({id:uid('c'),fase:next,llave,leg:1,home:wA,away:wB,hg:0,ag:0,pl:null,pv:null,status:'prox',ev:[]});changed=true}
   else if(ida.status==='prox'&&(ida.home!==wA||ida.away!==wB)){ida.home=wA;ida.away=wB;changed=true}
   if(next!=='FINAL'){
    let vta=db.cup.find(c=>c.llave===llave&&c.leg===2);
    if(!vta){db.cup.push({id:uid('c'),fase:next,llave,leg:2,home:wB,away:wA,hg:0,ag:0,pl:null,pv:null,status:'prox',ev:[]});changed=true}
    else if(vta.status==='prox'&&(vta.home!==wB||vta.away!==wA)){vta.home=wB;vta.away=wA;changed=true}
   }
  }
 }
 return changed;
}

 copaBracket(){
  const titles=['Dieciseisavos','Octavos','Cuartos','Semifinales','Final'];
  const prevWinnerLabel=(prevRound,idx)=>{const r=prevRound&&prevRound[idx];if(!r)return'—';return r.decided?tn(r.winner):'Pendiente'};
  const rounds_cache=[];
  const rounds=CUP_FASES.map((fase,fi)=>{
   const n=CUP_N[fase],items=[];
   for(let k=1;k<=n;k++){
    const agg=llaveAgg(`${fase}-${String(k).padStart(2,'0')}`);
    if(agg){items.push({...agg,real:true})}
    else{
     const prev=fi>0?rounds_cache[fi-1]:null;
     items.push({real:false,labelA:prevWinnerLabel(prev,2*k-2),labelB:prevWinnerLabel(prev,2*k-1)});
    }
   }
   rounds_cache[fi]=items;return items;
  });
  const H=820,BW=206,BH=40,GAP=34;
  const centerY=(k,n)=>((2*k+1)/(2*n))*H;
  const col=(items)=>`<div style="position:relative;width:${BW}px;height:${H}px;flex:none">${items.map((it,k)=>{
   const top=centerY(k,items.length)-BH/2;
   if(it.real){const bA=it.winner===it.A,bB=it.winner===it.B;
    const sc=(side,glob)=>{const legs=it.legs||[];const pen=it.pens?`<span class="bsc">(${it.pens[side]})p</span>`:'';
     if(legs.length<=1)return `<b>${legs[0]?.[side]??'–'}</b>${pen}`;
     return `<span class="bsc">${legs.map(l=>l[side]??'–').join(' | ')}</span><b>${glob??'–'}</b>${pen}`};
    return `<div class="bmatch" style="top:${top}px" onclick="go('copa',{copaView:'bracket',bracketSel:'${it.ll}'})">
     <div class="brow ${bA?'bw':''}">${crest(it.A)}<span>${tn(it.A)}</span>${sc('a',it.gA)}</div>
     <div class="brow ${bB?'bw':''}">${crest(it.B)}<span>${tn(it.B)}</span>${sc('b',it.gB)}</div></div>`;
   }
   return `<div class="bmatch" style="top:${top}px">
    <div class="brow"><span class="mu">${esc(it.labelA)}</span></div>
    <div class="brow"><span class="mu">${esc(it.labelB)}</span></div></div>`;
  }).join('')}</div>`;
  const svg=(n)=>{let s='';for(let k=0;k<n;k+=2){const cA=centerY(k,n),cB=centerY(k+1,n),mid=(cA+cB)/2;
    s+=`<path d="M0,${cA} H${GAP/2} M0,${cB} H${GAP/2} M${GAP/2},${cA} V${cB} M${GAP/2},${mid} H${GAP}" fill="none" stroke="currentColor" stroke-width="1"/>`;}
   return `<svg width="${GAP}" height="${H}" style="color:var(--ln);flex:none">${s}</svg>`};
  let out=`<div style="display:flex;overflow-x:auto;padding-bottom:8px;align-items:stretch">`;
  rounds.forEach((r,i)=>{out+=col(r);if(i<rounds.length-1)out+=svg(r.length)});
  out+='</div>';
  out=`<div class="lg" style="padding:0 0 8px">${titles.join(' · ')} — tocá cualquier cruce ya jugado para ver el detalle del partido. Los ganadores avanzan solos a la siguiente ronda.</div>`+out;
  if(S.bracketSel)out+=llaveBox(S.bracketSel.split('-')[0],S.bracketSel);
  return out;
 },

     <div class="discname"><a onclick="go('equipos',{team:'${r.p.team}'})">${esc(r.p.name)}</a><span class="mu">${tn(r.p.team)}</span>${(r.cerca&&!isCup)?'<span title="A una amarilla de la próxima suspensión">⚠️</span>':''}</div>
     <div class="dischist"><span class="mu">Histórico</span><span class="pill y">🟨${r.p.yc}</span><span class="pill r">🟥${r.p.rc}</span></div>
     <div class="discsanc">${r.pend?`<span class="pill pend">⛔ ${r.pend} pendiente${r.pend>1?'s':''}</span>`:`<span class="pill ok">✓ Al día</span>`}${edit?`<span class="donec">(${r.done} cumplida${r.done!=1?'s':''}${r.pend?`<button class="pri" title="Marcar un partido cumplido" onclick="bumpDone('${r.p.id}',${isCup},1)">✓ Cumplió</button>`:''}${r.done>0?`<button title="Deshacer" onclick="bumpDone('${r.p.id}',${isCup},-1)">↺</button>`:''})</span>`:''}</div>
    </div>`;
   const vacio=rows.length?'<div class="empty">Nadie en alerta por ahora.</div>':'<div class="empty">Sin tarjetas registradas.</div>';
   return`<div class="box"><h3>Historial${isCup?' · Copa THC':' · Liga'}</h3>${top.map(row).join('')||vacio}${rest.length?`<div id="${rid}" class="hide">${rest.map(row).join('')}</div><span class="vm" id="${rid}b" onclick="toggleList('${rid}')">Ver más</span>`:''}
   <div class="lg">${reglaTxt}${!isCup?' ⚠️ = a una amarilla de la próxima suspensión.':''}</div></div>`;};
  return alerta
      +tabla(ligaRows,false,'Liga: cada 3 amarillas acumuladas = 1 partido (3, 6, 9…). Cada roja = 1 partido directo y acumulativo (1, 2, 3…).')
      +tabla(copaRows,true,'Copa THC: cada 2 amarillas acumuladas = 1 partido (2, 4, 6…). Cada roja = 1 partido directo y acumulativo (1, 2, 3…). Más estricta por tener menos partidos.')
      +`<div class="lg">"Generadas" se calcula solo, a partir de las tarjetas, y nunca se resetea. "Cumplidas" la marca el editor a mano cada vez que un jugador se baja esa suspensión en un partido real; "Pendientes" es la resta de ambas.</div>`;
 },
 buscar(){
  const q=S.q.trim().toLowerCase();if(!q)return V.tablas();
  const ts=db.teams.filter(t=>t.name.toLowerCase().includes(q)),ps=db.players.filter(p=>p.name.toLowerCase().includes(q));
  return `<div class="box"><h3>Equipos</h3>${ts.map(t=>`<div class="rw"><a onclick="go('equipos',{team:'${t.id}'})">${esc(t.name)}</a><span class="mu">${DIVS[t.div]}</span></div>`).join('')||'<div class="empty">Sin resultados.</div>'}</div>
  <div class="box"><h3>Jugadores</h3>${ps.map(p=>`<div class="rw"><a onclick="go('equipos',{team:'${p.team}'})">${esc(p.name)}</a><span class="mu">${tn(p.team)}</span></div>`).join('')||'<div class="empty">Sin resultados.</div>'}</div>`;
 },
 editor(){
  const to=()=>db.teams.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('');
  return `<div class="box"><h3>Nuevo equipo</h3><div class="f"><input id="tnm" placeholder="Nombre"><select id="td">${Object.entries(DIVS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><select id="tf"><option value="">Federación (opcional)</option><option>Tucapelandia (TFA)</option><option>Islas Hyppia (HYFF)</option><option>Carling (histórico)</option></select><button class="pri" onclick="addTeam()">Agregar equipo</button></div></div>
  <div class="box"><h3>Nuevo jugador</h3><div class="f"><input id="pn" placeholder="Nombre"><select id="pt">${to()}</select><select id="pp"><option value="">Posición (opcional)</option><option value="POR">Arquero</option><option value="DEF">Defensa</option><option value="MED">Mediocampo</option><option value="DEL">Delantero</option></select><button class="pri" onclick="addPlayer()">Agregar jugador</button></div></div>
  <div class="box"><h3>Nuevo partido de liga</h3><div class="f"><select id="md">${Object.entries(DIVS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input id="mr" type="number" min="1" placeholder="Fecha" style="width:80px"><select id="mh">${to()}</select><select id="ma">${to()}</select><button class="pri" onclick="addMatch()">Agregar partido</button></div></div>
  <div class="box"><h3>Nuevo partido de copa</h3><div class="f"><select id="cf"><option>16AVOS</option><option>OCTAVOS</option><option>CUARTOS</option><option>SEMIFINAL</option><option>FINAL</option></select><input id="cl" placeholder="Llave (ej: OCTAVOS-01)" size="16"><select id="cg"><option value="1">Ida / único</option><option value="2">Vuelta</option><option value="3">Tercer partido</option></select><select id="ch">${to()}</select><select id="cw">${to()}</select><button class="pri" onclick="addCup()">Agregar partido de copa</button></div><div class="lg">Después de crearlo, los resultados y eventos se cargan desde la pestaña Copa con el botón Eventos de cada partido.</div></div>
  <div class="box"><h3>Datos</h3><div class="f"><button onclick="exp()">Exportar respaldo JSON</button><button onclick="document.getElementById('imp').click()">Importar JSON</button><input id="imp" type="file" accept=".json" hidden onchange="imp(this)"></div>
  <div class="lg">Los cambios se guardan en Supabase. Exportá un respaldo de vez en cuando. "Importar JSON" también escribe en Supabase: usalo solo si estás seguro de lo que estás por reemplazar.</div></div>`;
 }
};

function pl(id,k,v){db.players.find(p=>p.id===id)[k]=Math.max(0,+v||0);save()}
function addTeam(){const n=document.getElementById('tnm').value.trim();if(!n)return alert('Escribe un nombre');db.teams.push({id:uid('t'),name:n,div:td.value,fed:tf.value||null});save()}
function setFed(id,v){T(id).fed=v||null;save()}
function addPlayer(){const n=pn.value.trim();if(!n||!pt.value)return alert('Completa el nombre y el equipo');db.players.push({id:uid('p'),name:n,team:pt.value,position:pp.value||null,goals:0,mvp:0,yc:0,rc:0});save()}
function addMatch(){if(!mr.value||mh.value===ma.value)return alert('Indica la fecha y dos equipos distintos');db.matches.push({id:uid('m'),div:md.value,round:+mr.value,home:mh.value,away:ma.value,hg:0,ag:0,status:'prox'});S.div=md.value;S.round=+mr.value;save()}
function exp(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}));a.download='superliga-thc-respaldo.json';a.click()}
function imp(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.teams||!d.matches)throw 0;d.players=d.players||[];d.cup=d.cup||[];d.cupPlayers=d.cupPlayers||[];db=d;migrateCup();save();alert('Datos importados')}catch(e){alert('El archivo no tiene el formato esperado (teams, players, matches, cup).')}};r.readAsText(f)}

function render(){
 const tabs=[['tablas','Posiciones'],['fixture','Fixture'],['copa','Copa'],['jugadores','Estadísticas'],['equipos','Equipos'],['disciplina','Disciplina']];
 if(edit)tabs.push(['editor','Editor']);
 if(S.view==='editor'&&!edit)S.view='tablas';
 nav.innerHTML=tabs.map(([k,l])=>`<button class="${S.view===k?'on':''}" onclick="if(q.value){q.value='';S.q=''}go('${k}')">${l}</button>`).join('');
 eb.className='eb'+(edit?' on':'');eb.textContent=edit?'Editando':'Editor';
 app.innerHTML=(V[S.view]||V.tablas)();
}
(async()=>{
 try{
  const{data:{session}}=await sb.auth.getSession();
  if(session)edit=true;
  const remote=await Data.load();
  if(remote)db=remote;
 }catch(e){console.error(e)}
 const chg0=migrateCup(),chg1=ensureTercerPartido(),chg2=advanceCup(),chg3=applyStadiums();
 recompute();
 if(edit&&(chg0||chg1||chg2||chg3))Data.save(db);
 render();
})();
</script>
</body>
